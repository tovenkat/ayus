# GLiNER-BioMed NER sidecar as a Docker service.
#
# Usage:
#   docker compose up -d         # start in background
#   docker compose logs -f       # follow logs
#   docker compose down          # stop
#   docker compose build         # rebuild after Dockerfile / requirements change
#
# The named volume `hf_cache` keeps the downloaded model weights across
# restarts (~/.cache/huggingface). Change GLINER_MODEL to swap models.

services:
  gliner-sidecar:
    build: .
    container_name: phr2-gliner-sidecar
    ports:
      - "8001:8001"
    volumes:
      - hf_cache:/root/.cache/huggingface
    environment:
      GLINER_MODEL: "${GLINER_MODEL:-Ihor/gliner-biomed-base-v1.0}"
      GLINER_DEVICE: "${GLINER_DEVICE:-cpu}"
      GLINER_THRESHOLD: "${GLINER_THRESHOLD:-0.5}"
      GLINER_LABELS: "${GLINER_LABELS:-lab test,biomarker,disease,medication,anatomical site}"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health', timeout=3).read()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 120s

volumes:
  hf_cache:
