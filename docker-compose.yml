# Ayus — production stack (single droplet).
#   docker compose up -d                      # app + postgres + ollama + caddy (CPU)
#   COMPUTE_MODE=gpu → deploy.sh layers docker-compose.gpu.yml (NVIDIA Ollama)
#
# Secrets come from .env (compose interpolates ${...} from it). Never commit .env.

services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    environment:
      # Keep models resident between requests (CPU model-load is expensive).
      # -1 = forever; keep the chat + embed models both loaded (avoid swap
      # thrash between an embed call and the chat call in one RAG request).
      OLLAMA_KEEP_ALIVE: ${OLLAMA_KEEP_ALIVE:--1}
      OLLAMA_MAX_LOADED_MODELS: ${OLLAMA_MAX_LOADED_MODELS:-2}
      OLLAMA_NUM_PARALLEL: ${OLLAMA_NUM_PARALLEL:-1}
    volumes:
      - ollama:/root/.ollama
    # No published ports — only the app talks to it over the internal network.

  app:
    build:
      context: .
      target: runner
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      PORT: "3000"
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public
      OLLAMA_HOST: http://ollama:11434
      UPLOADS_DIR: /data/uploads
      # Reach the GLiNER sidecar over the internal network (only used when
      # ENABLE_GLINER=true and the "gliner" profile is up). Harmless otherwise —
      # the client fails fast and skips NER if the sidecar isn't reachable.
      GLINER_SIDECAR_URL: http://gliner:8001
    volumes:
      - uploads:/data/uploads
    depends_on:
      postgres:
        condition: service_healthy
      ollama:
        condition: service_started

  # One-off migration/bootstrap runner (full deps + prisma CLI + tsx). Not part
  # of `up`; invoked by deploy.sh:  docker compose run --rm migrate
  migrate:
    build:
      context: .
      target: builder
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public
      # Same as the app — so seed/reembed scripts can reach Ollama for embeddings
      # (without this, embedding in `docker compose run migrate` hits localhost
      # inside the one-off container and fails).
      OLLAMA_HOST: http://ollama:11434
    depends_on:
      postgres:
        condition: service_healthy
    profiles: ["tools"]
    command: ["npx", "prisma", "migrate", "deploy"]

  # GLiNER-BioMed NER sidecar (biomedical entity extraction for clinical text).
  # Opt-in: only starts under the "gliner" profile (deploy.sh activates it when
  # ENABLE_GLINER=true). Internal-only; the app reaches it at http://gliner:8001.
  # First build pulls PyTorch (large) and first start downloads model weights
  # (~500 MB) into the hf_cache volume.
  gliner:
    build: ./scripts/gliner-sidecar
    restart: unless-stopped
    profiles: ["gliner"]
    environment:
      GLINER_MODEL: ${GLINER_MODEL:-Ihor/gliner-biomed-base-v1.0}
      GLINER_DEVICE: ${GLINER_DEVICE:-cpu}
      GLINER_THRESHOLD: ${GLINER_THRESHOLD:-0.5}
      GLINER_LABELS: ${GLINER_LABELS:-lab test,biomarker,disease,medication,anatomical site}
    volumes:
      - hf_cache:/root/.cache/huggingface
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health', timeout=3).read()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 180s

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app

volumes:
  pgdata:
  ollama:
  uploads:
  caddy_data:
  caddy_config:
  hf_cache: # GLiNER model weights (HuggingFace cache), persisted across restarts
