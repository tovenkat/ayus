# Ayus — served by the dockerized app on 127.0.0.1:3000.
# Install:
#   sudo cp deploy/nginx/ayus.in.conf /etc/nginx/sites-available/ayus.in
#   sudo ln -s /etc/nginx/sites-available/ayus.in /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d ayus.in -d www.ayus.in   # adds TLS + 80→443 redirect
server {
    listen 80;
    listen [::]:80;
    server_name ayus.in www.ayus.in;   # drop www if it has no DNS record

    client_max_body_size 60M;          # matches the app's 50MB upload cap

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;      # app builds https URLs from this
        proxy_set_header Upgrade           $http_upgrade; # websockets / HMR
        proxy_set_header Connection        "upgrade";
        proxy_read_timeout 300s;          # long extractions
        proxy_buffering off;
    }
}
